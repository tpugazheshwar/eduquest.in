<style>

 if(win&&e.wins>0&&e.wins%3===0){g+=1;ln.push([`🏆 ${e.wins} wins in a row`,'💎 1'])}
 if(e.boost>0){const m=e.bmul||2,x=c*(m-1);c*=m;e.boost--;ln.push(['⚡ Coin ×'+m+' booster ('+e.boost+' left)','🪙 +'+x])}
 give(c,g);return{c,g,ln}}

/* ---------- page ---------- */
const solvedN=l=>l==='js'?CH.filter((_,i)=>P.solved&&P.solved[i]).length:CC.filter(c=>P.solved&&P.solved[key(l,c.id)]).length;

function jsCard(c,i){const d=draft['js_'+i]!=null?draft['js_'+i]:c[2];

<script id="fixes-js">
(function(){
/* make sure every profile object the game reads exists, whatever account/guest was just loaded */
const OBJ=['arcs','solved','boss','ch','tu','sk','lab'];
window.ensureP=function(){if(!P||typeof P!=='object')return;OBJ.forEach(k=>{if(!P[k]||typeof P[k]!=='object')P[k]={}});['xp','quiz','right','total'].forEach(k=>{if(!(P[k]>=0))P[k]=0})};

/* user code in the JS challenges: check it in a background worker first so an endless loop cannot freeze the page */
const _rc=runC;
function guard(code,name,tests){return new Promise(res=>{let w;try{
  const src='onmessage=function(e){var d=e.data,r={ok:1};try{var f=new Function(d.code+";return "+d.name+";")();for(var i=0;i<d.tests.length;i++){f.apply(null,d.tests[i][0])}}catch(x){r.err=String(x)}postMessage(r)}';

  w.onmessage=e=>{clearTimeout(t);try{w.terminate()}catch(x){}res(e.data||{ok:1})};
  w.onerror=()=>{clearTimeout(t);try{w.terminate()}catch(x){}res({ok:1,skip:1})};
  try{w.postMessage({code,name,tests})}catch(e){clearTimeout(t);res({ok:1,skip:1})}})}
